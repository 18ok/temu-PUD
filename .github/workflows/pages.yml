name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'temu-dashboard/temu-dashboard.html'
      - 'temu-dashboard/docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare docs/index.html
        run: |
          mkdir -p docs
          if [ -f temu-dashboard/docs/index.html ]; then
            cp temu-dashboard/docs/index.html docs/index.html
          else
            cp temu-dashboard/temu-dashboard.html docs/index.html
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
