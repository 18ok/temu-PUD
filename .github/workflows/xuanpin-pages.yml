name: Deploy 选品心决 to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - '选品心决技巧/**'
      - '.github/workflows/xuanpin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xuanpin-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site into docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r "选品心决技巧/." docs/
          rm -f docs/打开网站.bat
          rm -f docs/本地预览-仅开发用.bat
          touch docs/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
