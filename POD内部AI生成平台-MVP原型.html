<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POD内部AI生成平台 - MVP原型</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .svg-icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ============================================================
    //  POD AI Studio — MVP 原型
    //  引擎方案：豆包 / Hermes / Claude 3.5 (标题)
    //            Gemini 3.1 Flash / DALL-E 3 / SDXL (图片)
    // ============================================================

    // ===== 内联 SVG 图标 =====
    const Icons = {
      Sparkles:    (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>`,
      ImageIcon:   (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>`,
      TypeIcon:    (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>`,
      FolderOpen:  (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>`,
      SettingsIcon:(s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`,
      Home:        (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
      Download:    (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`,
      Copy:        (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`,
      RefreshCw:   (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>`,
      Heart:       (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
      Trash2:      (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>`,
      Search:      (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
      Filter:      (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>`,
      Plus:        (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`,
      Check:       (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      ChevronRight:(s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
      ChevronDown: (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`,
      Zap:         (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
      Package:     (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16.5 9.4-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></svg>`,
      Bell:        (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`,
      Shield:      (s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
      AlertTriangle:(s) => `<svg class="svg-icon" style="width:${s||16}px;height:${s||16}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12" y1="17" y2="17.01"/></svg>`,
    };
    function icon(name, size) { return Icons[name] ? Icons[name](size) : ''; }

    // ===== 产品 & 风格 =====
    const products = [
      { id: 'tshirt', name: 'T恤', icon: '👕' },
      { id: 'mug', name: '马克杯', icon: '☕' },
      { id: 'phonecase', name: '手机壳', icon: '📱' },
      { id: 'bag', name: '帆布包', icon: '👜' },
      { id: 'pillow', name: '抱枕', icon: '🛏️' },
      { id: 'hoodie', name: '卫衣', icon: '🧥' }
    ];
    const styles = [
      { id: 'cartoon', name: '卡通' }, { id: 'realistic', name: '写实' },
      { id: 'minimal', name: '极简' }, { id: 'vintage', name: '复古' },
      { id: 'cyberpunk', name: '赛博朋克' }, { id: 'watercolor', name: '水彩' }
    ];

    // ===== 🎨 图片生成引擎 (已更新) =====
    const imageEngines = [
      { id: 'gemini-flash', name: 'Gemini 3.1 Flash Image', emoji: '🚀', tag: '推荐', tagColor: 'green',
        detail: 'Google 最新 | 速度快 | 性价比高', costPer: 0.50, provider: 'Google' },
      { id: 'dalle3', name: 'DALL-E 3', emoji: '⭐', tag: '高质量', tagColor: 'purple',
        detail: 'OpenAI | 最稳定 | 细节出色', costPer: 1.50, provider: 'OpenAI' },
      { id: 'sdxl', name: 'Stable Diffusion XL', emoji: '💰', tag: '经济', tagColor: 'gray',
        detail: '开源模型 | 批量降本 | 灵活部署', costPer: 0.20, provider: 'Stability AI' }
    ];

    // ===== 📝 标题生成引擎 (已更新) =====
    const titleEngines = [
      { id: 'doubao', name: '豆包 (Doubao)', emoji: '🇨🇳', tag: '推荐', tagColor: 'green',
        detail: '字节跳动 | 中文最强 | 性价比高', costPer: 0.005, provider: 'ByteDance',
        region: '中文市场' },
      { id: 'hermes', name: 'Hermes (Nous Hermes 2)', emoji: '🌍', tag: '经济', tagColor: 'blue',
        detail: '开源模型 | 英文流畅 | 几乎免费', costPer: 0.001, provider: 'Nous Research',
        region: '英文批量' },
      { id: 'claude35', name: 'Claude 3.5 Sonnet', emoji: '⭐', tag: '高质量', tagColor: 'purple',
        detail: 'Anthropic | 创意最强 | 英文最佳', costPer: 0.03, provider: 'Anthropic',
        region: '高质量英文' }
    ];

    const marketOptions = [
      { id: 'us', name: '🇺🇸 美国' }, { id: 'uk', name: '🇬🇧 英国' },
      { id: 'eu', name: '🇪🇺 欧洲' }, { id: 'jp', name: '🇯🇵 日本' }
    ];
    const demoImages = ['🎨', '🌊', '🐕', '☕', '🌸', '🎸', '🚀', '🌈'];
    const libraryEmojis = ['🎨', '🌊', '🐕', '☕', '🌸', '🎸', '🚀', '🌈', '⚡', '🔥', '💎', '🎯'];

    // ===== 状态 =====
    let currentPage = 'dashboard';
    let selectedImageEngine = 'gemini-flash';
    let selectedTitleEngine = 'doubao';
    let selectedProduct = 'tshirt';
    let selectedStyle = 'cartoon';
    let prompt = '';
    let isGenerating = false;
    let generatedImages = [];
    let titlePrompt = '';
    let generatedTitles = [];
    let isGeneratingTitles = false;
    let selectedMarket = 'us';
    let imageCount = 4;
    let titleCount = 10;
    let savedItems = [1, 3, 5];

    function getImageEngine() { return imageEngines.find(e => e.id === selectedImageEngine); }
    function getTitleEngine() { return titleEngines.find(e => e.id === selectedTitleEngine); }

    // ===== 渲染入口 =====
    function render() {
      document.getElementById('root').innerHTML = `
        <div class="flex bg-slate-50 min-h-screen">
          ${renderSidebar()}
          <div class="flex-1 overflow-auto">
            ${renderTopbar()}
            <div id="page-content">
              ${currentPage === 'dashboard' ? renderDashboard() : ''}
              ${currentPage === 'image' ? renderImageGeneration() : ''}
              ${currentPage === 'title' ? renderTitleGeneration() : ''}
              ${currentPage === 'library' ? renderLibrary() : ''}
              ${currentPage === 'settings' ? renderSettings() : ''}
            </div>
          </div>
        </div>`;
      bindEvents();
    }

    // ===== 侧边栏 =====
    function renderSidebar() {
      const items = [
        { id: 'dashboard', icon: 'Home', label: '工作台' },
        { id: 'image', icon: 'ImageIcon', label: '图案生成' },
        { id: 'title', icon: 'TypeIcon', label: '标题生成' },
        { id: 'library', icon: 'FolderOpen', label: '素材库' },
        { id: 'settings', icon: 'SettingsIcon', label: '系统设置' }
      ];
      return `
        <div class="w-60 bg-slate-900 text-white h-screen flex flex-col flex-shrink-0">
          <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">${icon('Sparkles',20)}</div>
              <div><div class="font-bold text-sm">POD AI Studio</div><div class="text-xs text-slate-400">内部工作台 v2.0</div></div>
            </div>
          </div>
          <nav class="flex-1 p-4 space-y-1">
            ${items.map(item => `
              <button data-page="${item.id}" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors ${currentPage===item.id?'bg-purple-600 text-white':'text-slate-300 hover:bg-slate-800'}">
                <span class="w-4 h-4 flex items-center justify-center">${icon(item.icon,16)}</span>${item.label}
              </button>`).join('')}
          </nav>
          <div class="p-4 border-t border-slate-800">
            <div class="bg-slate-800 rounded-lg p-3">
              <div class="text-xs text-slate-400 mb-1">本月API消耗</div>
              <div class="text-lg font-bold">¥1,247</div>
              <div class="w-full bg-slate-700 rounded-full h-1.5 mt-2"><div class="bg-purple-500 h-1.5 rounded-full" style="width:60%"></div></div>
              <div class="text-xs text-slate-400 mt-1">预算 ¥2,000</div>
            </div>
          </div>
        </div>`;
    }

    // ===== 顶栏 =====
    function renderTopbar() {
      const titles = { dashboard:'工作台', image:'图案生成', title:'标题生成', library:'素材库', settings:'系统设置' };
      return `
        <div class="bg-white border-b border-slate-200 px-8 py-3 flex items-center justify-between">
          <div class="flex items-center gap-2 text-sm text-slate-500">
            <span>POD AI Studio</span><span class="w-3 h-3 flex items-center justify-center">${icon('ChevronRight',12)}</span><span class="text-slate-800 font-medium">${titles[currentPage]}</span>
          </div>
          <div class="flex items-center gap-3">
            <button class="p-2 hover:bg-slate-100 rounded-lg relative"><span class="w-4 h-4 flex items-center justify-center text-slate-600">${icon('Bell',16)}</span><span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
            <div class="flex items-center gap-2 px-3 py-1.5 hover:bg-slate-100 rounded-lg cursor-pointer">
              <div class="w-7 h-7 bg-gradient-to-br from-purple-400 to-pink-400 rounded-full flex items-center justify-center text-white text-xs font-medium">我</div>
              <span class="text-sm text-slate-700">张三</span><span class="w-3 h-3 flex items-center justify-center text-slate-500">${icon('ChevronDown',12)}</span>
            </div>
          </div>
        </div>`;
    }

    // ===== 工作台 =====
    function renderDashboard() {
      const stats = [
        { label:'今日生成图案', value:'156', change:'+23%', icon:'ImageIcon', color:'purple' },
        { label:'今日生成标题', value:'420', change:'+18%', icon:'TypeIcon', color:'pink' },
        { label:'素材库总数', value:'3,287', change:'+5%', icon:'FolderOpen', color:'blue' },
        { label:'已上架产品', value:'892', change:'+12%', icon:'Package', color:'green' }
      ];
      const recent = [
        { type:'image', text:'Surfing dog with sunglasses (Gemini 3.1 Flash)', time:'5分钟前', user:'张三' },
        { type:'title', text:'为T恤生成了10条标题 (豆包)', time:'12分钟前', user:'李四' },
        { type:'image', text:'Vintage retro coffee mug design (DALL-E 3)', time:'28分钟前', user:'张三' },
        { type:'title', text:'为马克杯生成了5条标题 (Claude 3.5)', time:'1小时前', user:'王五' }
      ];
      return `
        <div class="p-8">
          <div class="mb-8"><h1 class="text-2xl font-bold text-slate-800">工作台</h1><p class="text-slate-500 mt-1">早上好，今天准备生成什么爆款？</p></div>
          <div class="grid grid-cols-4 gap-4 mb-8">
            ${stats.map(s => `
              <div class="bg-white rounded-xl p-5 border border-slate-200">
                <div class="flex items-center justify-between mb-3">
                  <div class="w-10 h-10 rounded-lg bg-${s.color}-100 flex items-center justify-center text-${s.color}-600"><span class="w-5 h-5 flex items-center justify-center">${icon(s.icon,20)}</span></div>
                  <span class="text-xs text-green-600 font-medium">${s.change}</span>
                </div>
                <div class="text-2xl font-bold text-slate-800">${s.value}</div>
                <div class="text-sm text-slate-500 mt-1">${s.label}</div>
              </div>`).join('')}
          </div>
          <div class="grid grid-cols-2 gap-6 mb-8">
            <div data-page="image" class="nav-btn bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl p-6 text-white cursor-pointer hover:shadow-xl transition-shadow">
              <span class="w-10 h-10 flex items-center justify-center mb-4">${icon('ImageIcon',40)}</span>
              <h3 class="text-xl font-bold mb-2">图案生成</h3>
              <p class="text-purple-100 text-sm mb-4">Gemini 3.1 Flash · DALL-E 3 · SDXL 多引擎切换</p>
              <div class="flex items-center gap-2 text-sm font-medium">立即开始 <span class="w-4 h-4 flex items-center justify-center">${icon('ChevronRight',16)}</span></div>
            </div>
            <div data-page="title" class="nav-btn bg-gradient-to-br from-blue-500 to-cyan-500 rounded-2xl p-6 text-white cursor-pointer hover:shadow-xl transition-shadow">
              <span class="w-10 h-10 flex items-center justify-center mb-4">${icon('TypeIcon',40)}</span>
              <h3 class="text-xl font-bold mb-2">标题生成</h3>
              <p class="text-blue-100 text-sm mb-4">豆包 · Hermes · Claude 3.5 批量生成SEO标题</p>
              <div class="flex items-center gap-2 text-sm font-medium">立即开始 <span class="w-4 h-4 flex items-center justify-center">${icon('ChevronRight',16)}</span></div>
            </div>
          </div>
          <div class="bg-white rounded-xl border border-slate-200 p-6">
            <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-slate-800">最近生成记录</h3><button class="text-sm text-purple-600 hover:underline">查看全部</button></div>
            <div class="space-y-3">${recent.map(item => `
              <div class="flex items-center gap-3 p-3 hover:bg-slate-50 rounded-lg transition-colors">
